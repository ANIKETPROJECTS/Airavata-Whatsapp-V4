openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: integration
    description: Connected account operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /integration/facebook/repair-webhook-subscription:
    post:
      operationId: repairFacebookWebhookSubscription
      tags: [integration]
      summary: Repair the authenticated user's WhatsApp webhook subscription
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Webhook subscription confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookWebhookSubscriptionStatus"
        "401":
          description: Authentication required
        "404":
          description: No tenant WhatsApp credential is available
        "409":
          description: The credential cannot be used for tenant repair
        "500":
          description: Subscription repair failed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FacebookWebhookSubscriptionStatus:
      type: object
      properties:
        ok:
          type: boolean
        subscribed:
          type: boolean
      required:
        - ok
        - subscribed

