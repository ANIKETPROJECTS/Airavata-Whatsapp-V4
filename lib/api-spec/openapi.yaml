openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: integration
    description: Connected account operations
  - name: chatbot
    description: Chatbot execution activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /integration/facebook/repair-webhook-subscription:
    post:
      operationId: repairFacebookWebhookSubscription
      tags: [integration]
      summary: Repair the authenticated user's WhatsApp webhook subscription
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Webhook subscription confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookWebhookSubscriptionStatus"
        "401":
          description: Authentication required
        "404":
          description: No tenant WhatsApp credential is available
        "409":
          description: The credential cannot be used for tenant repair
        "500":
          description: Subscription repair failed
  /integrations/autogamma/outbound-messages:
    post:
      operationId: ingestAutoGammaOutboundMessage
      tags: [integration]
      summary: Record an externally sent WhatsApp message in Live Chat
      description: >
        Called by AutoGamma after Meta accepts an outbound message. The sender
        must provide the rendered body and Meta WhatsApp message ID. This
        endpoint does not send messages, trigger campaigns, or retry WhatsApp messages.
      security:
        - airavataApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoGammaOutboundMessageInput"
      responses:
        "201":
          description: Outbound message recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoGammaOutboundMessageResult"
        "200":
          description: This Meta message ID was already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoGammaOutboundMessageResult"
        "400":
          description: Invalid request body
        "401":
          description: Invalid API key or unrecognized WhatsApp phone-number mapping
        "409":
          description: The tenant's stored WhatsApp credential does not match this phone number
        "500":
          description: Message ingestion failed
  /integrations/v1/whatsapp/templates:
    get:
      operationId: listPublicWhatsAppTemplates
      tags: [integration]
      summary: List approved WhatsApp templates for an API-key authenticated tenant
      security:
        - airavataApiKey: []
      parameters:
        - in: query
          name: phoneNumberId
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: Approved templates available to send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppTemplatesResponse"
        "400":
          description: Invalid or missing phone number ID
        "401":
          description: Invalid API key
        "409":
          description: Phone number ID does not match the tenant's WhatsApp account
        "500":
          description: Template listing failed
  /integrations/v1/whatsapp/messages/text:
    post:
      operationId: sendPublicWhatsAppTextMessage
      tags: [integration]
      summary: Send a WhatsApp free-text reply within the 24-hour service window
      description: >
        Requires an active contact and an inbound WhatsApp message within the
        previous 24 hours. Use an approved template outside that window.
      security:
        - airavataApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicWhatsAppTextMessageInput"
      responses:
        "201":
          description: WhatsApp accepted the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppMessageResult"
        "200":
          description: Idempotent retry; the client message ID was already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppMessageResult"
        "400":
          description: Invalid request body or phone number
        "401":
          description: Invalid API key
        "409":
          description: Phone number mapping conflict or client message ID already used
        "422":
          description: Contact is inactive or the 24-hour service window is closed
        "502":
          description: WhatsApp rejected the send
        "500":
          description: Integration request failed before sending
  /integrations/v1/whatsapp/messages/template:
    post:
      operationId: sendPublicWhatsAppTemplateMessage
      tags: [integration]
      summary: Send an approved WhatsApp template
      description: >
        Sends a template owned by the tenant and records the message in Live
        Chat. Template sends use the tenant's configured category-based credit
        rates unless billing is managed directly by Meta.
      security:
        - airavataApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicWhatsAppTemplateMessageInput"
      responses:
        "201":
          description: WhatsApp accepted the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppMessageResult"
        "200":
          description: Idempotent retry; the client message ID was already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppMessageResult"
        "400":
          description: Invalid request body or phone number
        "401":
          description: Invalid API key
        "402":
          description: Insufficient credits for this template category
        "404":
          description: Approved template not found
        "409":
          description: Phone number mapping conflict or client message ID already used
        "422":
          description: Contact is inactive
        "502":
          description: WhatsApp rejected the send
        "500":
          description: Integration request failed before sending
  /chatbot/flows/{id}/executions/query:
    post:
      operationId: searchChatbotFlowExecutions
      tags: [chatbot]
      summary: Search recent executions for a chatbot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotExecutionQuery"
      responses:
        "200":
          description: A page of chatbot executions and lifetime summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotExecutionPage"
        "400":
          description: Invalid flow ID, filters, or pagination parameters
        "401":
          description: Authentication required
        "404":
          description: Chatbot not found
        "500":
          description: Could not load chatbot activity
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    airavataApiKey:
      type: http
      scheme: bearer
      bearerFormat: Airavata API key
      description: Create an API key in Airavata's Integrations page and store it on your server.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FacebookWebhookSubscriptionStatus:
      type: object
      properties:
        ok:
          type: boolean
        subscribed:
          type: boolean
      required:
        - ok
        - subscribed
    AutoGammaOutboundMessageInput:
      type: object
      required:
        - phoneNumberId
        - whatsappMessageId
        - recipientPhone
        - body
      properties:
        phoneNumberId:
          type: string
          minLength: 1
          maxLength: 64
          description: Meta phone_number_id that sent the message
        whatsappMessageId:
          type: string
          minLength: 1
          maxLength: 255
          description: The wamid returned by Meta for this send
        recipientPhone:
          type: string
          minLength: 7
          maxLength: 32
          description: Recipient phone number in international format
        body:
          type: string
          maxLength: 10000
          description: Fully rendered message text; an empty string is valid for media-only templates
        sentAt:
          type: string
          format: date-time
          description: When Meta accepted the send; defaults to receipt time when omitted
        media:
          $ref: "#/components/schemas/AutoGammaOutboundMediaInput"
    AutoGammaOutboundMediaInput:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [image, document, video, audio]
        url:
          type: string
          pattern: "^https://"
          description: Optional HTTPS URL that Live Chat can display
        id:
          type: string
          maxLength: 255
          description: Optional Meta media ID
        filename:
          type: string
          maxLength: 255
    AutoGammaOutboundMessageResult:
      type: object
      required:
        - ok
        - created
        - contactId
        - messageId
        - whatsappMessageId
      properties:
        ok:
          type: boolean
        created:
          type: boolean
        contactId:
          type: string
        messageId:
          type: string
        whatsappMessageId:
          type: string
    PublicWhatsAppTextMessageInput:
      type: object
      required: [phoneNumberId, to, text, clientMessageId]
      properties:
        phoneNumberId:
          type: string
          pattern: "^[0-9]+$"
          description: The connected Meta phone number ID shown in Airavata.
        to:
          type: string
          minLength: 7
          maxLength: 32
          description: Recipient phone number in international format, such as +919876543210.
        text:
          type: string
          minLength: 1
          maxLength: 4096
        clientMessageId:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique ID from your system. Reusing it prevents a retry from sending twice.
    PublicWhatsAppTemplateMessageInput:
      type: object
      required: [phoneNumberId, to, templateName, languageCode, clientMessageId]
      properties:
        phoneNumberId:
          type: string
          pattern: "^[0-9]+$"
        to:
          type: string
          minLength: 7
          maxLength: 32
          description: Recipient phone number in international format, such as +919876543210.
        templateName:
          type: string
          minLength: 1
          maxLength: 512
        languageCode:
          type: string
          minLength: 1
          maxLength: 32
        clientMessageId:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique ID from your system. Reusing it prevents a retry from sending twice.
        components:
          type: array
          items:
            type: object
            additionalProperties: true
          description: WhatsApp template components in Meta's send-message format.
    PublicWhatsAppMessageResult:
      type: object
      required: [ok, duplicate, messageId, contactId, whatsappMessageId, status]
      properties:
        ok:
          type: boolean
        duplicate:
          type: boolean
        messageId:
          type: string
        contactId:
          type: string
        whatsappMessageId:
          type: ["string", "null"]
        status:
          type: string
          enum: [QUEUED, SENT, DELIVERED, READ, FAILED]
    PublicWhatsAppTemplatesResponse:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/PublicWhatsAppTemplate"
    PublicWhatsAppTemplate:
      type: object
      required: [name, language, category, body, components]
      properties:
        name:
          type: string
        language:
          type: string
        category:
          type: string
          enum: [AUTHENTICATION, UTILITY, MARKETING]
        body:
          type: string
        components:
          type: array
          items:
            type: object
            additionalProperties: true
    ChatbotExecution:
      type: object
      required:
        - id
        - contactId
        - contactName
        - contactPhone
        - triggerType
        - status
        - startedAt
        - lastActivityAt
        - endedAt
      properties:
        id:
          type: string
        contactId:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        triggerType:
          type: string
          enum: [KEYWORD, DEFAULT, TEMPLATE_LINK, LEGACY_SESSION]
        status:
          type: string
          enum: [ACTIVE, COMPLETED, INTERRUPTED, STOPPED, FAILED]
        startedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
    ChatbotExecutionStats:
      type: object
      required:
        - triggered
        - completed
        - active
        - interrupted
        - stopped
        - failed
      properties:
        triggered:
          type: integer
        completed:
          type: integer
        active:
          type: integer
        interrupted:
          type: integer
        stopped:
          type: integer
        failed:
          type: integer
    ChatbotExecutionPage:
      type: object
      required:
        - executions
        - stats
        - nextCursor
      properties:
        executions:
          type: array
          items:
            $ref: "#/components/schemas/ChatbotExecution"
        stats:
          $ref: "#/components/schemas/ChatbotExecutionStats"
        nextCursor:
          type: ["string", "null"]
    ChatbotExecutionQuery:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
        cursor:
          type: string
          maxLength: 256
        status:
          type: string
          enum: [ACTIVE, COMPLETED, INTERRUPTED, STOPPED, FAILED]
        triggerType:
          type: string
          enum: [KEYWORD, DEFAULT, TEMPLATE_LINK, LEGACY_SESSION]
          description: Filter by how the chatbot run was triggered.
        search:
          type: string
          maxLength: 100
          description: Case-insensitive contact name or phone search.
        startedAtFrom:
          type: string
          format: date-time
          description: Inclusive start timestamp for filtering by run start time.
        startedAtBefore:
          type: string
          format: date-time
          description: Exclusive end timestamp for filtering by run start time.

