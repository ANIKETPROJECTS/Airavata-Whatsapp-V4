openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: integration
    description: Connected account operations
  - name: chatbot
    description: Chatbot execution activity
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /integration/facebook/repair-webhook-subscription:
    post:
      operationId: repairFacebookWebhookSubscription
      tags: [integration]
      summary: Repair the authenticated user's WhatsApp webhook subscription
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Webhook subscription confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookWebhookSubscriptionStatus"
        "401":
          description: Authentication required
        "404":
          description: No tenant WhatsApp credential is available
        "409":
          description: The credential cannot be used for tenant repair
        "500":
          description: Subscription repair failed
  /integrations/autogamma/outbound-messages:
    post:
      operationId: ingestAutoGammaOutboundMessage
      tags: [integration]
      summary: Record an externally sent WhatsApp message in Live Chat
      description: >
        Called by AutoGamma after Meta accepts an outbound message. The sender
        must provide the rendered body and Meta WhatsApp message ID. This
        endpoint does not send messages, trigger campaigns, or retry WhatsApp messages.
      security:
        - airavataApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoGammaOutboundMessageInput"
      responses:
        "201":
          description: Outbound message recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoGammaOutboundMessageResult"
        "200":
          description: This Meta message ID was already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoGammaOutboundMessageResult"
        "400":
          description: Invalid request body
        "401":
          description: Invalid API key or unrecognized WhatsApp phone-number mapping
        "409":
          description: The tenant's stored WhatsApp credential does not match this phone number
        "500":
          description: Message ingestion failed
  /chatbot/flows/{id}/executions/query:
    post:
      operationId: searchChatbotFlowExecutions
      tags: [chatbot]
      summary: Search recent executions for a chatbot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotExecutionQuery"
      responses:
        "200":
          description: A page of chatbot executions and lifetime summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotExecutionPage"
        "400":
          description: Invalid flow ID, filters, or pagination parameters
        "401":
          description: Authentication required
        "404":
          description: Chatbot not found
        "500":
          description: Could not load chatbot activity
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    airavataApiKey:
      type: http
      scheme: bearer
      bearerFormat: Airavata API key
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FacebookWebhookSubscriptionStatus:
      type: object
      properties:
        ok:
          type: boolean
        subscribed:
          type: boolean
      required:
        - ok
        - subscribed
    AutoGammaOutboundMessageInput:
      type: object
      required:
        - phoneNumberId
        - whatsappMessageId
        - recipientPhone
        - body
      properties:
        phoneNumberId:
          type: string
          minLength: 1
          maxLength: 64
          description: Meta phone_number_id that sent the message
        whatsappMessageId:
          type: string
          minLength: 1
          maxLength: 255
          description: The wamid returned by Meta for this send
        recipientPhone:
          type: string
          minLength: 7
          maxLength: 32
          description: Recipient phone number in international format
        body:
          type: string
          maxLength: 10000
          description: Fully rendered message text; an empty string is valid for media-only templates
        sentAt:
          type: string
          format: date-time
          description: When Meta accepted the send; defaults to receipt time when omitted
        media:
          $ref: "#/components/schemas/AutoGammaOutboundMediaInput"
    AutoGammaOutboundMediaInput:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [image, document, video, audio]
        url:
          type: string
          pattern: "^https://"
          description: Optional HTTPS URL that Live Chat can display
        id:
          type: string
          maxLength: 255
          description: Optional Meta media ID
        filename:
          type: string
          maxLength: 255
    AutoGammaOutboundMessageResult:
      type: object
      required:
        - ok
        - created
        - contactId
        - messageId
        - whatsappMessageId
      properties:
        ok:
          type: boolean
        created:
          type: boolean
        contactId:
          type: string
        messageId:
          type: string
        whatsappMessageId:
          type: string
    ChatbotExecution:
      type: object
      required:
        - id
        - contactId
        - contactName
        - contactPhone
        - triggerType
        - status
        - startedAt
        - lastActivityAt
        - endedAt
      properties:
        id:
          type: string
        contactId:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        triggerType:
          type: string
          enum: [KEYWORD, DEFAULT, TEMPLATE_LINK, LEGACY_SESSION]
        status:
          type: string
          enum: [ACTIVE, COMPLETED, INTERRUPTED, STOPPED, FAILED]
        startedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
    ChatbotExecutionStats:
      type: object
      required:
        - triggered
        - completed
        - active
        - interrupted
        - stopped
        - failed
      properties:
        triggered:
          type: integer
        completed:
          type: integer
        active:
          type: integer
        interrupted:
          type: integer
        stopped:
          type: integer
        failed:
          type: integer
    ChatbotExecutionPage:
      type: object
      required:
        - executions
        - stats
        - nextCursor
      properties:
        executions:
          type: array
          items:
            $ref: "#/components/schemas/ChatbotExecution"
        stats:
          $ref: "#/components/schemas/ChatbotExecutionStats"
        nextCursor:
          type: ["string", "null"]
    ChatbotExecutionQuery:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
        cursor:
          type: string
          maxLength: 256
        status:
          type: string
          enum: [ACTIVE, COMPLETED, INTERRUPTED, STOPPED, FAILED]
        search:
          type: string
          maxLength: 100
          description: Case-insensitive contact name or phone search.
        startedAtFrom:
          type: string
          format: date-time
          description: Inclusive start timestamp for filtering by run start time.
        startedAtBefore:
          type: string
          format: date-time
          description: Exclusive end timestamp for filtering by run start time.

