openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: integration
    description: Connected account operations
  - name: chatbot
    description: Chatbot execution activity
  - name: waPay
    description: Native WhatsApp Payments for India
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /integration/facebook/repair-webhook-subscription:
    post:
      operationId: repairFacebookWebhookSubscription
      tags: [integration]
      summary: Repair the authenticated user's WhatsApp webhook subscription
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Webhook subscription confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookWebhookSubscriptionStatus"
        "401":
          description: Authentication required
        "404":
          description: No tenant WhatsApp credential is available
        "409":
          description: The credential cannot be used for tenant repair
        "500":
          description: Subscription repair failed
  /integration/whatsapp/catalog-settings:
    get:
      operationId: getWhatsAppCatalogSettings
      tags: [integration]
      summary: Get the authenticated tenant's connected WhatsApp catalog
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalog connection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogSettingsResponse"
        "401":
          description: Authentication required
        "500":
          description: Could not load catalog settings
  /integration/whatsapp/catalog-context:
    get:
      operationId: getWhatsAppCatalogContext
      tags: [integration]
      summary: Get the tenant's Meta business and pages eligible for catalog creation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Meta business and owned pages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogContext"
        "401":
          description: Authentication required
        "409":
          description: No WhatsApp business account is connected
        "502":
          description: Meta business or page lookup failed
  /integration/whatsapp/catalogs:
    get:
      operationId: listWhatsAppCatalogs
      tags: [integration]
      summary: List catalogs available to the authenticated tenant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalogs owned by the tenant's Meta business or connected to its WABA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogListResponse"
        "401":
          description: Authentication required
        "502":
          description: Meta catalog lookup failed
    post:
      operationId: createWhatsAppCatalog
      tags: [integration]
      summary: Create a catalog in the tenant's Meta business and attach it to WhatsApp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppCatalogCreateInput"
      responses:
        "201":
          description: Catalog created and attached to the tenant's WABA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogSettingsResponse"
        "400":
          description: Invalid catalog name or page
        "401":
          description: Authentication required
        "409":
          description: WhatsApp is not connected or this is a protected operator account
        "502":
          description: Meta could not create or attach the catalog; required permissions may be missing
  /integration/whatsapp/catalogs/connect:
    post:
      operationId: connectWhatsAppCatalog
      tags: [integration]
      summary: Attach an existing catalog to the tenant's WhatsApp business account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppCatalogConnectInput"
      responses:
        "200":
          description: Catalog attached and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogSettingsResponse"
        "400":
          description: Invalid catalog ID
        "401":
          description: Authentication required
        "409":
          description: WhatsApp is not connected or this is a protected operator account
        "502":
          description: Meta could not verify or attach the catalog
  /integration/whatsapp/catalog/visibility:
    get:
      operationId: getWhatsAppCatalogVisibility
      tags: [integration]
      summary: Get storefront visibility and cart settings for the tenant's WhatsApp number
      security:
        - bearerAuth: []
      responses:
        "200":
          description: WhatsApp commerce settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogVisibilityResponse"
        "401":
          description: Authentication required
        "502":
          description: Meta commerce settings lookup failed
    patch:
      operationId: updateWhatsAppCatalogVisibility
      tags: [integration]
      summary: Update catalog visibility and cart settings for the tenant's WhatsApp number
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppCatalogVisibilityInput"
      responses:
        "200":
          description: WhatsApp commerce settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogVisibilityResponse"
        "400":
          description: Invalid visibility settings
        "401":
          description: Authentication required
        "409":
          description: Connect a catalog before making it visible
        "502":
          description: Meta commerce settings update failed
  /integration/whatsapp/catalog/products:
    get:
      operationId: listWhatsAppCatalogProducts
      tags: [integration]
      summary: List a page of products in the tenant's connected catalog
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: after
          required: false
          schema:
            type: string
            maxLength: 512
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          description: Catalog products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogProductsResponse"
        "401":
          description: Authentication required
        "409":
          description: No catalog is connected
        "502":
          description: Meta product lookup failed
    post:
      operationId: createWhatsAppCatalogProduct
      tags: [integration]
      summary: Add a product to the tenant's connected catalog
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppCatalogProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogProductResponse"
        "400":
          description: Invalid product data
        "401":
          description: Authentication required
        "409":
          description: No catalog is connected
        "502":
          description: Meta product creation failed
  /integration/whatsapp/catalog/products/{productId}:
    patch:
      operationId: updateWhatsAppCatalogProduct
      tags: [integration]
      summary: Update a product in the tenant's connected catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppCatalogProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogProductResponse"
        "400":
          description: Invalid product data
        "401":
          description: Authentication required
        "404":
          description: Product not found in this catalog
        "409":
          description: No catalog is connected
        "502":
          description: Meta product update failed
    delete:
      operationId: deleteWhatsAppCatalogProduct
      tags: [integration]
      summary: Delete a product from the tenant's connected catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppCatalogProductDeleteResponse"
        "401":
          description: Authentication required
        "404":
          description: Product not found in this catalog
        "409":
          description: No catalog is connected
        "502":
          description: Meta product deletion failed
  /integrations/autogamma/outbound-messages:
    post:
      operationId: ingestAutoGammaOutboundMessage
      tags: [integration]
      summary: Record an externally sent WhatsApp message in Live Chat
      description: >
        Called by AutoGamma after Meta accepts an outbound message. The sender
        must provide the rendered body and Meta WhatsApp message ID. This
        endpoint does not send messages, trigger campaigns, or retry WhatsApp messages.
      security:
        - airavataApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoGammaOutboundMessageInput"
      responses:
        "201":
          description: Outbound message recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoGammaOutboundMessageResult"
        "200":
          description: This Meta message ID was already recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoGammaOutboundMessageResult"
        "400":
          description: Invalid request body
        "401":
          description: Invalid API key or unrecognized WhatsApp phone-number mapping
        "409":
          description: The tenant's stored WhatsApp credential does not match this phone number
        "500":
          description: Message ingestion failed
  /integrations/v1/whatsapp/templates:
    get:
      operationId: listPublicWhatsAppTemplates
      tags: [integration]
      summary: List approved WhatsApp templates for an API-key authenticated tenant
      security:
        - airavataApiKey: []
      parameters:
        - in: query
          name: phoneNumberId
          required: true
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: Approved templates available to send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppTemplatesResponse"
        "400":
          description: Invalid or missing phone number ID
        "401":
          description: Invalid API key
        "409":
          description: Phone number ID does not match the tenant's WhatsApp account
        "500":
          description: Template listing failed
  /integrations/v1/whatsapp/messages/text:
    post:
      operationId: sendPublicWhatsAppTextMessage
      tags: [integration]
      summary: Send a WhatsApp free-text reply within the 24-hour service window
      description: >
        Requires an active contact and an inbound WhatsApp message within the
        previous 24 hours. Use an approved template outside that window.
      security:
        - airavataApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicWhatsAppTextMessageInput"
      responses:
        "201":
          description: WhatsApp accepted the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppMessageResult"
        "200":
          description: Idempotent retry; the client message ID was already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppMessageResult"
        "400":
          description: Invalid request body or phone number
        "401":
          description: Invalid API key
        "409":
          description: Phone number mapping conflict or client message ID already used
        "422":
          description: Contact is inactive or the 24-hour service window is closed
        "502":
          description: WhatsApp rejected the send
        "500":
          description: Integration request failed before sending
  /integrations/v1/whatsapp/messages/template:
    post:
      operationId: sendPublicWhatsAppTemplateMessage
      tags: [integration]
      summary: Send an approved WhatsApp template
      description: >
        Sends a template owned by the tenant and records the message in Live
        Chat. Template sends use the tenant's configured category-based credit
        rates unless billing is managed directly by Meta.
      security:
        - airavataApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicWhatsAppTemplateMessageInput"
      responses:
        "201":
          description: WhatsApp accepted the message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppMessageResult"
        "200":
          description: Idempotent retry; the client message ID was already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicWhatsAppMessageResult"
        "400":
          description: Invalid request body or phone number
        "401":
          description: Invalid API key
        "402":
          description: Insufficient credits for this template category
        "404":
          description: Approved template not found
        "409":
          description: Phone number mapping conflict or client message ID already used
        "422":
          description: Contact is inactive
        "502":
          description: WhatsApp rejected the send
        "500":
          description: Integration request failed before sending
  /wa-pay:
    get:
      operationId: getWaPayDashboard
      tags: [waPay]
      summary: Get WhatsApp Pay settings, eligible contacts, and recent orders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: WhatsApp Pay dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaPayDashboard"
        "401":
          description: Authentication required
        "500":
          description: Could not load WhatsApp Pay data
  /wa-pay/settings/connect:
    post:
      operationId: connectWaPayRazorpay
      tags: [waPay]
      summary: Create or reuse a WhatsApp payment configuration and start Razorpay authorization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaPaySetupInput"
      responses:
        "200":
          description: Razorpay setup started or an active configuration was connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaPaySetupResult"
        "400":
          description: Invalid redirect URL
        "401":
          description: Authentication required
        "409":
          description: WhatsApp Business Account is not connected
        "502":
          description: Meta could not start or verify Razorpay setup
        "500":
          description: Could not start Razorpay setup
  /wa-pay/orders:
    post:
      operationId: createWaPayOrder
      tags: [waPay]
      summary: Send a native Razorpay order-details payment request
      description: >
        Requires a linked Razorpay payment configuration and an active WhatsApp
        customer-service window for the selected contact.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaPayOrderInput"
      responses:
        "201":
          description: Payment request accepted by WhatsApp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaPayOrder"
        "400":
          description: Invalid order
        "401":
          description: Authentication required
        "404":
          description: Contact not found
        "409":
          description: WhatsApp Pay configuration is missing or the contact window is closed
        "502":
          description: WhatsApp rejected the payment request
        "500":
          description: Could not create the payment request
  /wa-pay/orders/{id}/verify:
    post:
      operationId: verifyWaPayOrder
      tags: [waPay]
      summary: Verify an order payment directly with Meta
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      responses:
        "200":
          description: Verified payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaPayOrder"
        "401":
          description: Authentication required
        "404":
          description: Payment order not found
        "409":
          description: Meta payment details do not match the local order
        "502":
          description: Meta payment lookup failed
        "500":
          description: Could not verify the payment
  /wa-pay/orders/{id}/refund:
    post:
      operationId: refundWaPayOrder
      tags: [waPay]
      summary: Request a full or partial refund through Meta
      description: Requires a successful Meta payment lookup and a payment configuration ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaPayRefundInput"
      responses:
        "200":
          description: Refund request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaPayOrder"
        "400":
          description: Invalid refund amount or speed
        "401":
          description: Authentication required
        "404":
          description: Payment order not found
        "409":
          description: Payment is not captured, the configuration ID is missing, or the refundable balance is insufficient
        "502":
          description: Meta could not accept the refund
        "500":
          description: Could not create the refund
  /wa-pay/orders/{id}/status:
    post:
      operationId: updateWaPayOrderStatus
      tags: [waPay]
      summary: Send an order-status update to the customer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaPayOrderStatusInput"
      responses:
        "200":
          description: Order status sent to WhatsApp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaPayOrder"
        "400":
          description: Invalid order status or transition
        "401":
          description: Authentication required
        "404":
          description: Payment order not found
        "502":
          description: WhatsApp rejected the order status
        "500":
          description: Could not update the order status
  /chatbot/flows/{id}/executions/query:
    post:
      operationId: searchChatbotFlowExecutions
      tags: [chatbot]
      summary: Search recent executions for a chatbot
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[a-fA-F0-9]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotExecutionQuery"
      responses:
        "200":
          description: A page of chatbot executions and lifetime summary counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotExecutionPage"
        "400":
          description: Invalid flow ID, filters, or pagination parameters
        "401":
          description: Authentication required
        "404":
          description: Chatbot not found
        "500":
          description: Could not load chatbot activity
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    airavataApiKey:
      type: http
      scheme: bearer
      bearerFormat: Airavata API key
      description: Create an API key in Airavata's Integrations page and store it on your server.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FacebookWebhookSubscriptionStatus:
      type: object
      properties:
        ok:
          type: boolean
        subscribed:
          type: boolean
      required:
        - ok
        - subscribed
    AutoGammaOutboundMessageInput:
      type: object
      required:
        - phoneNumberId
        - whatsappMessageId
        - recipientPhone
        - body
      properties:
        phoneNumberId:
          type: string
          minLength: 1
          maxLength: 64
          description: Meta phone_number_id that sent the message
        whatsappMessageId:
          type: string
          minLength: 1
          maxLength: 255
          description: The wamid returned by Meta for this send
        recipientPhone:
          type: string
          minLength: 7
          maxLength: 32
          description: Recipient phone number in international format
        body:
          type: string
          maxLength: 10000
          description: Fully rendered message text; an empty string is valid for media-only templates
        sentAt:
          type: string
          format: date-time
          description: When Meta accepted the send; defaults to receipt time when omitted
        media:
          $ref: "#/components/schemas/AutoGammaOutboundMediaInput"
    AutoGammaOutboundMediaInput:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [image, document, video, audio]
        url:
          type: string
          pattern: "^https://"
          description: Optional HTTPS URL that Live Chat can display
        id:
          type: string
          maxLength: 255
          description: Optional Meta media ID
        filename:
          type: string
          maxLength: 255
    AutoGammaOutboundMessageResult:
      type: object
      required:
        - ok
        - created
        - contactId
        - messageId
        - whatsappMessageId
      properties:
        ok:
          type: boolean
        created:
          type: boolean
        contactId:
          type: string
        messageId:
          type: string
        whatsappMessageId:
          type: string
    PublicWhatsAppTextMessageInput:
      type: object
      required: [phoneNumberId, to, text, clientMessageId]
      properties:
        phoneNumberId:
          type: string
          pattern: "^[0-9]+$"
          description: The connected Meta phone number ID shown in Airavata.
        to:
          type: string
          minLength: 7
          maxLength: 32
          description: Recipient phone number in international format, such as +919876543210.
        text:
          type: string
          minLength: 1
          maxLength: 4096
        clientMessageId:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique ID from your system. Reusing it prevents a retry from sending twice.
    PublicWhatsAppTemplateMessageInput:
      type: object
      required: [phoneNumberId, to, templateName, languageCode, clientMessageId]
      properties:
        phoneNumberId:
          type: string
          pattern: "^[0-9]+$"
        to:
          type: string
          minLength: 7
          maxLength: 32
          description: Recipient phone number in international format, such as +919876543210.
        templateName:
          type: string
          minLength: 1
          maxLength: 512
        languageCode:
          type: string
          minLength: 1
          maxLength: 32
        clientMessageId:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique ID from your system. Reusing it prevents a retry from sending twice.
        components:
          type: array
          items:
            type: object
            additionalProperties: true
          description: WhatsApp template components in Meta's send-message format.
    PublicWhatsAppMessageResult:
      type: object
      required: [ok, duplicate, messageId, contactId, whatsappMessageId, status]
      properties:
        ok:
          type: boolean
        duplicate:
          type: boolean
        messageId:
          type: string
        contactId:
          type: string
        whatsappMessageId:
          type: ["string", "null"]
        status:
          type: string
          enum: [QUEUED, SENT, DELIVERED, READ, FAILED]
    PublicWhatsAppTemplatesResponse:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/PublicWhatsAppTemplate"
    PublicWhatsAppTemplate:
      type: object
      required: [name, language, category, body, components]
      properties:
        name:
          type: string
        language:
          type: string
        category:
          type: string
          enum: [AUTHENTICATION, UTILITY, MARKETING]
        body:
          type: string
        components:
          type: array
          items:
            type: object
            additionalProperties: true
    WaPaySetupInput:
      type: object
      required: [redirectUrl]
      properties:
        redirectUrl:
          type: string
          maxLength: 2048
          description: Airavata return URL after Razorpay authorization.
    WaPaySetupResult:
      type: object
      required: [configurationName, configurationStatus, authorizationUrl, expiresAt]
      properties:
        configurationName:
          type: string
        configurationStatus:
          type: string
          enum: [Active, Needs_Connecting, Needs_Testing]
        authorizationUrl:
          type: ["string", "null"]
        expiresAt:
          type: ["integer", "null"]
    WaPaySettings:
      type: object
      required: [gateway, configurationName, paymentConfigId, configurationStatus, providerMid]
      properties:
        gateway:
          type: string
          enum: [razorpay]
        configurationName:
          type: ["string", "null"]
        paymentConfigId:
          type: ["string", "null"]
        configurationStatus:
          type: ["string", "null"]
          enum: [Active, Needs_Connecting, Needs_Testing, Not_Found, Unknown, null]
        providerMid:
          type: ["string", "null"]
    WaPayDashboard:
      type: object
      required: [settings, whatsappConnected, eligibleContacts, orders]
      properties:
        settings:
          $ref: "#/components/schemas/WaPaySettings"
        whatsappConnected:
          type: boolean
        eligibleContacts:
          type: array
          items:
            $ref: "#/components/schemas/WaPayEligibleContact"
        orders:
          type: array
          items:
            $ref: "#/components/schemas/WaPayOrder"
    WaPayEligibleContact:
      type: object
      required: [id, name, phone, lastInboundAt, windowExpiresAt]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        lastInboundAt:
          type: string
          format: date-time
        windowExpiresAt:
          type: string
          format: date-time
    WaPayOrderInput:
      type: object
      required: [contactId, goodsType, items]
      properties:
        contactId:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
        goodsType:
          type: string
          enum: [digital-goods, physical-goods]
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/WaPayOrderItemInput"
        taxValue:
          type: integer
          minimum: 0
          default: 0
          description: Tax in INR paise.
        shippingValue:
          type: integer
          minimum: 0
          default: 0
          description: Shipping amount in INR paise.
        discountValue:
          type: integer
          minimum: 0
          default: 0
          description: Discount in INR paise.
        beneficiaries:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/WaPayBeneficiaryInput"
          description: Required for physical goods; shipping recipients are sent to Meta for compliance.
        body:
          type: string
          maxLength: 1024
        footer:
          type: string
          maxLength: 60
    WaPayOrderItemInput:
      type: object
      required: [name, quantity, unitAmountValue]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        unitAmountValue:
          type: integer
          minimum: 1
          description: Per-item amount in INR paise.
        countryOfOrigin:
          type: string
          maxLength: 80
          description: Required for physical goods when no catalog is attached.
        importerName:
          type: string
          maxLength: 200
          description: Required for physical goods when no catalog is attached.
        importerAddress:
          $ref: "#/components/schemas/WaPayImporterAddressInput"
    WaPayBeneficiaryInput:
      type: object
      required: [name, addressLine1, city, state, postalCode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        addressLine1:
          type: string
          minLength: 1
          maxLength: 100
        addressLine2:
          type: string
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        postalCode:
          type: string
          pattern: "^\\d{6}$"
    WaPayImporterAddressInput:
      type: object
      required: [addressLine1, city, zoneCode, postalCode, countryCode]
      properties:
        addressLine1:
          type: string
          minLength: 1
          maxLength: 100
        addressLine2:
          type: string
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        zoneCode:
          type: string
          minLength: 1
          maxLength: 60
        postalCode:
          type: string
          minLength: 1
          maxLength: 20
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
    WaPayOrder:
      type: object
      required:
        - id
        - referenceId
        - contactId
        - contactName
        - recipientPhone
        - goodsType
        - items
        - amountValue
        - currency
        - sendStatus
        - paymentStatus
        - verificationState
        - orderStatus
        - transactions
        - refunds
        - metaMessageId
        - sendError
        - lastVerifiedAt
        - createdAt
      properties:
        id:
          type: string
        referenceId:
          type: string
        contactId:
          type: string
        contactName:
          type: string
        recipientPhone:
          type: string
        goodsType:
          type: string
          enum: [digital-goods, physical-goods]
        items:
          type: array
          items:
            $ref: "#/components/schemas/WaPayOrderItem"
        amountValue:
          type: integer
        currency:
          type: string
          enum: [INR]
        sendStatus:
          type: string
          enum: [sending, sent, failed]
        paymentStatus:
          type: string
          enum: [pending, captured]
        verificationState:
          type: string
          enum: [unverified, verified, mismatch]
        orderStatus:
          type: string
          enum: [pending, captured, failed]
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/WaPayTransaction"
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/WaPayRefund"
        metaMessageId:
          type: ["string", "null"]
        sendError:
          type: ["string", "null"]
        lastVerifiedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    WaPayOrderItem:
      type: object
      required: [name, quantity, unitAmountValue]
      properties:
        name:
          type: string
        quantity:
          type: integer
        unitAmountValue:
          type: integer
    WaPayTransaction:
      type: object
      required: [id, gatewayPaymentId, status, amountValue, method, errorCode, errorReason, updatedAt]
      properties:
        id:
          type: string
        gatewayPaymentId:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, success, failed]
        amountValue:
          type: ["integer", "null"]
        method:
          type: ["string", "null"]
        errorCode:
          type: ["string", "null"]
        errorReason:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
          format: date-time
    WaPayRefund:
      type: object
      required: [id, amountValue, status, speedProcessed, createdAt]
      properties:
        id:
          type: string
        amountValue:
          type: integer
        status:
          type: string
          enum: [pending, success, failed]
        speedProcessed:
          type: ["string", "null"]
          enum: [instant, normal, null]
        createdAt:
          type: ["string", "null"]
          format: date-time
    WaPayRefundInput:
      type: object
      required: [amountValue]
      properties:
        amountValue:
          type: integer
          minimum: 1
          description: Refund amount in INR paise.
        speed:
          type: string
          enum: [instant, normal]
          default: normal
    WaPayOrderStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, captured, failed]
        description:
          type: string
          maxLength: 120
    ChatbotExecution:
      type: object
      required:
        - id
        - contactId
        - contactName
        - contactPhone
        - triggerType
        - status
        - startedAt
        - lastActivityAt
        - endedAt
      properties:
        id:
          type: string
        contactId:
          type: ["string", "null"]
        contactName:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        triggerType:
          type: string
          enum: [KEYWORD, DEFAULT, TEMPLATE_LINK, LEGACY_SESSION]
        status:
          type: string
          enum: [ACTIVE, COMPLETED, INTERRUPTED, STOPPED, FAILED]
        startedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        endedAt:
          type: ["string", "null"]
          format: date-time
    ChatbotExecutionStats:
      type: object
      required:
        - triggered
        - completed
        - active
        - interrupted
        - stopped
        - failed
      properties:
        triggered:
          type: integer
        completed:
          type: integer
        active:
          type: integer
        interrupted:
          type: integer
        stopped:
          type: integer
        failed:
          type: integer
    ChatbotExecutionPage:
      type: object
      required:
        - executions
        - stats
        - nextCursor
      properties:
        executions:
          type: array
          items:
            $ref: "#/components/schemas/ChatbotExecution"
        stats:
          $ref: "#/components/schemas/ChatbotExecutionStats"
        nextCursor:
          type: ["string", "null"]
    ChatbotExecutionQuery:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 25
        cursor:
          type: string
          maxLength: 256
        status:
          type: string
          enum: [ACTIVE, COMPLETED, INTERRUPTED, STOPPED, FAILED]
        triggerType:
          type: string
          enum: [KEYWORD, DEFAULT, TEMPLATE_LINK, LEGACY_SESSION]
          description: Filter by how the chatbot run was triggered.
        search:
          type: string
          maxLength: 100
          description: Case-insensitive contact name or phone search.
        startedAtFrom:
          type: string
          format: date-time
          description: Inclusive start timestamp for filtering by run start time.
        startedAtBefore:
          type: string
          format: date-time
          description: Exclusive end timestamp for filtering by run start time.
