kind = "mobile"
previewPath = "/airavata-mobile/"
title = "Airavata Live Chat Mobile"
description = "A minimal tenant-facing mobile app for logging in and managing WhatsApp Live Chat conversations across Sent, Open, and Closed tabs."
version = "1.0.0"
id = "artifacts/airavata-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/airavata-mobile/" ]
localPort = 18114

[services.development]
run = "pnpm --filter @workspace/airavata-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/airavata-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/airavata-mobile", "run", "serve" ]

[services.env]
PORT = "18114"
BASE_PATH = "/airavata-mobile/"
